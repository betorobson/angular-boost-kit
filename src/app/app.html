<mat-toolbar class="site-toolbar">
  <button mat-icon-button class="menu-button" aria-label="Abrir navegação" (click)="navigation.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <a class="brand" routerLink="/" (click)="closeNavigation()">
    <mat-icon aria-hidden="true">widgets</mat-icon>
    <span>Angular Boost Kit</span>
  </a>
  <span class="toolbar-spacer"></span>
  <a mat-button routerLink="/components/select-virtual-scroll" (click)="closeNavigation()">Documentação</a>
</mat-toolbar>

<mat-sidenav-container class="docs-shell">
  <mat-sidenav #navigation class="docs-navigation" [mode]="isSmallScreen() ? 'over' : 'side'" [opened]="!isSmallScreen()">
    <div class="navigation-heading">ANGULAR BOOST KIT</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active" (click)="closeNavigation()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Início</span>
      </a>
      <div class="navigation-section">Componentes</div>
      <a mat-list-item routerLink="/components/select-virtual-scroll" routerLinkActive="active" (click)="closeNavigation()">
        <mat-icon matListItemIcon>arrow_drop_down_circle</mat-icon>
        <span matListItemTitle>Select Virtual Scroll</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
